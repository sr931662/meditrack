# Local development stack. NOT a production deployment (see docs/DEPLOYMENT.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medtrack
      POSTGRES_PASSWORD: medtrack-dev-only
      POSTGRES_DB: medtrack
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medtrack"]
      interval: 5s
      retries: 10

  migrate:
    build: ./server
    command: alembic upgrade head
    env_file: ./server/.env.example
    environment:
      MEDTRACK_DATABASE_URL: postgresql+psycopg://medtrack:medtrack-dev-only@db:5432/medtrack
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./server
    env_file: ./server/.env.example
    environment:
      MEDTRACK_DATABASE_URL: postgresql+psycopg://medtrack:medtrack-dev-only@db:5432/medtrack
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: ./server
    command: python -m app.worker
    env_file: ./server/.env.example
    environment:
      MEDTRACK_DATABASE_URL: postgresql+psycopg://medtrack:medtrack-dev-only@db:5432/medtrack
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
